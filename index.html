// PWA SETUP (manifest + service worker + install prompt)
// ============================================================
(function() {
  // 1. manifest.json を動的に生成してリンク
  const manifest = {
    name: PWA_APP_NAME,
    short_name: PWA_APP_SHORT_NAME,
    description: PWA_APP_DESC,
    start_url: "./",
    display: "standalone",
    background_color: PWA_BG_COLOR,
    theme_color: PWA_THEME_COLOR,
    orientation: "portrait",
    icons: [
      { src: "data:image/png;base64," + PWA_ICON_192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: "data:image/png;base64," + PWA_ICON_512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // 2. iOS用のホーム画面アイコン・メタタグ
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = "data:image/png;base64," + PWA_ICON_192;
  document.head.appendChild(appleIcon);

  const metaCapable = document.createElement('meta');
  metaCapable.name = 'apple-mobile-web-app-capable';
  metaCapable.content = 'yes';
  document.head.appendChild(metaCapable);

  const metaStatusBar = document.createElement('meta');
  metaStatusBar.name = 'apple-mobile-web-app-status-bar-style';
  metaStatusBar.content = 'black-translucent';
  document.head.appendChild(metaStatusBar);

  const metaTitle = document.createElement('meta');
  metaTitle.name = 'apple-mobile-web-app-title';
  metaTitle.content = PWA_APP_SHORT_NAME;
  document.head.appendChild(metaTitle);

  const metaTheme = document.createElement('meta');
  metaTheme.name = 'theme-color';
  metaTheme.content = PWA_THEME_COLOR;
  document.head.appendChild(metaTheme);

  // 3. ホーム画面に追加していない場合に案内を表示（iOS Safari向け）
  function isInStandaloneMode() {
    return ('standalone' in window.navigator) && (window.navigator.standalone);
  }
  function isIOS() {
    return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  }

  function showInstallHint() {
    if (isInStandaloneMode()) return; // すでにホーム画面から起動している
    if (localStorage.getItem('pwa_install_hint_dismissed')) return;
    if (!isIOS()) return; // 今回はiOS Safari向けの案内のみ実装

    const hint = document.createElement('div');
    hint.id = 'pwa-install-hint';
    hint.style = `
      position: fixed; left: 16px; right: 16px; bottom: 56px;
      background: white; border: 2px solid ${PWA_THEME_COLOR};
      border-radius: 16px; padding: 14px 16px; z-index: 10000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex; align-items: center; gap: 10px;
    `;
    hint.innerHTML = `
      <div style="flex:1; font-size:12px; line-height:1.6; color:#1c1c1a;">
        <strong>📲 ホーム画面に追加</strong>すると、アプリのように使えます。<br>
        下の<strong>共有ボタン</strong>（□と↑）→「ホーム画面に追加」をタップ。
      </div>
      <button id="pwa-hint-close" style="background:none;border:none;font-size:18px;cursor:pointer;color:#9ca3af;flex-shrink:0;">✕</button>
    `;
    document.body.appendChild(hint);
    document.getElementById('pwa-hint-close').onclick = function() {
      hint.remove();
      localStorage.setItem('pwa_install_hint_dismissed', 'true');
    };
  }

  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(showInstallHint, 2000);
  });
})();

</script>

<style>
/* ============================================================
   ROOT
============================================================ */
:root {
  --white: #ffffff;
  --off-white: #f8f8f6;
  --ink: #1c1c1a;
  --gray: #6b6b68;
  --light-gray: #e8e8e4;

  /* Era accent colors */
  --era-jomon-accent:   #d97706;
  --era-jomon-bg:       #fef3c7;
  --era-nara-accent:    #7c3aed;
  --era-nara-bg:        #ede9fe;
  --era-kamakura-accent:#0284c7;
  --era-kamakura-bg:    #e0f2fe;
  --era-sengoku-accent: #dc2626;
  --era-sengoku-bg:     #fee2e2;
  --era-edo-accent:     #ca8a04;
  --era-edo-bg:         #fef9c3;
  --era-meiji-accent:   #2563eb;
  --era-meiji-bg:       #dbeafe;
  --era-showa-accent:   #65a30d;
  --era-showa-bg:       #ecfccb;

  /* UI colors */
  --coral:    #ff5e5b;
  --mint:     #00c9a7;
  --yellow:   #ffe135;
  --sky:      #5bc8f5;
  --lavender: #a78bfa;

  /* Current era (dynamic) */
  --cur-accent: var(--era-edo-accent);
  --cur-bg:     var(--era-edo-bg);

  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 3px 3px 0 var(--ink);
  --shadow-sm: 2px 2px 0 var(--ink);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--off-white);
  color: var(--ink);
  min-height: 100vh;
}

/* ============================================================
   SCREENS
============================================================ */
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ============================================================
   SHARED NAV HEADER
============================================================ */
.app-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: #1c1c1a;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 3px solid var(--cur-accent);
}
.back-btn {
  background: none;
  border: 2px solid rgba(255,255,255,0.6);
  color: #ffffff;
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.1em;
  padding: 5px 12px;
  cursor: pointer;
  border-radius: 100px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.back-btn:hover { border-color: #fde68a; color: #fde68a; }
.header-title {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 16px; font-weight: 700;
  color: #ffffff; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.header-badge {
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.1em;
  padding: 4px 10px;
  border-radius: 100px;
  background: #fde68a;
  color: #1c1c1a;
  flex-shrink: 0;
}

/* ============================================================
   HOME SCREEN
============================================================ */
#screen-home {
  background: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 100%);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(255,225,53,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(255,94,91,0.1) 0%, transparent 50%);
  padding: 28px 16px 40px;
  align-items: center;
}

.home-logo {
  text-align: center;
  max-width: 520px; width: 100%;
  margin-bottom: 28px;
  animation: fadeUp 0.6s 0.1s ease both;
}
.home-icon {
  font-size: 48px; display: block; margin-bottom: 10px;
  animation: spinIn 0.8s cubic-bezier(0.34,1.56,0.64,1) both;

}
.quiz-feedback.show { display:block; }
.quiz-feedback.correct-fb { background:#dcfce7; border-color:#16a34a; }
.quiz-feedback.wrong-fb { background:#fee2e2; border-color:var(--coral); }

.quiz-next-btn {
  background:var(--ink); border:none; color:white;
  font-family:'Syne',sans-serif; font-size:14px; font-weight:700;
  letter-spacing:0.1em; padding:13px 22px;
  border-radius:100px; cursor:pointer;
  box-shadow:2px 2px 0 var(--cur-accent);
  align-self:flex-end; display:none; transition:all 0.15s;
}

.quiz-next-btn:hover { transform:translate(-1px,-1px); }

.quiz-result { display:none; flex-direction:column; align-items:center; padding:28px 16px; text-align:center; gap:12px; }
.quiz-result.show { display:flex; }
.result-stamp { font-size:52px; animation:stampIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes stampIn { from{transform:scale(3);opacity:0} to{transform:scale(1);opacity:1} }
.result-score { font-family:'Syne',sans-serif; font-size:64px; font-weight:800; color:#ef4444; line-height:1; }
.result-label { font-size:18px; font-weight:900; color:var(--ink); }
.result-sub { font-size:14px; color:var(--gray); line-height:1.7; }
.result-btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
.result-btn {
  border:2.5px solid var(--ink); background:white;
  font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:0.1em; padding:11px 20px;
  border-radius:100px; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:all 0.15s;
}
.result-btn:hover { transform:translate(-1px,-1px); box-shadow:var(--shadow); }
.result-btn.primary { background:var(--ink); color:white; border-color:var(--cur-accent); box-shadow:2px 2px 0 var(--cur-accent); }

const TRIAL_DAYS = 7;
const UNLOCK_STORAGE_KEY = 'app_unlocked_' + APP_ID;
const BUNDLE_UNLOCK_KEY = 'bundle_unlocked_v1';
const TRIAL_START_KEY = 'app_trial_start_' + APP_ID;

function initTrialSystem() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('unlock') === 'yes') {
    localStorage.setItem(UNLOCK_STORAGE_KEY, 'true');
  }
  if (params.get('unlock') === 'bundle') {
    localStorage.setItem(BUNDLE_UNLOCK_KEY, 'true');
  }
  if (!localStorage.getItem(TRIAL_START_KEY)) {
    localStorage.setItem(TRIAL_START_KEY, Date.now().toString());
  }
}

function isUnlocked() {
  return localStorage.getItem(UNLOCK_STORAGE_KEY) === 'true'
      || localStorage.getItem(BUNDLE_UNLOCK_KEY) === 'true';
}

function getTrialDaysLeft() {
  const start = parseInt(localStorage.getItem(TRIAL_START_KEY) || Date.now().toString());
  const elapsed = Date.now() - start;
  const daysElapsed = elapsed / (1000 * 60 * 60 * 24);
  return Math.max(0, Math.ceil(TRIAL_DAYS - daysElapsed));
}

function isTrialActive() {
  return getTrialDaysLeft() > 0;
}

function isContentAccessible() {
  return isUnlocked() || isTrialActive();
}

        }
]

</script>
<script>
// STATE

<script>
// ============================================================
// ERA THEME APPLY
// ============================================================
function applyEraTheme(era) {
  const r = document.documentElement.style;
  r.setProperty('--cur-accent', `var(--era-${era.id}-accent)`);
  r.setProperty('--cur-bg', `var(--era-${era.id}-bg)`);
  document.getElementById('home-icon').textContent = era.icon;
}

// ============================================================
// INIT HOME
// ============================================================
function initEraGrid() {
  const grid = document.getElementById('era-grid');
  grid.innerHTML = ERAS.map(era => {
    const readCount = (readMap[era.id] || []).length;
    const total = era.episodes.length;
    return `<div class="era-card ${era.cls}${era.id===currentEraId?' selected':''}" onclick="selectEraAndGo('${era.id}')">
      <div class="era-badge">${era.badge}</div>
      <span class="era-icon">${era.icon}</span>
      <div class="era-period">${era.period}</div>
      <div class="era-name">${era.name}</div>
      <div class="era-sub">${era.sub}</div>
      ${readCount>0?`<div class="era-progress">📖 ${readCount}/${total}話</div>`:''}
    </div>`;
  }).join('');
}

function selectEra(id) {
  currentEraId = id;
  currentEra = ERAS.find(e => e.id === id);
  applyEraTheme(currentEra);
  document.querySelectorAll('.era-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.era-card.${id}`)?.classList.add('selected');
}

function selectEraAndGo(id) {
  selectEra(id);
  goToHub();
}

function goToHub() {
  renderHub();
  showScreen('hub');
}

// ============================================================
// HUB
// ============================================================
function renderHub() {
  const era = currentEra;
  document.getElementById('hub-badge').textContent = era.badge;
  document.getElementById('hub-badge').style.background = `var(--era-${era.id}-accent)`;
  document.getElementById('hub-header-title').textContent = era.name;
  document.getElementById('hub-icon').textContent = era.icon;
  document.getElementById('hub-title').innerHTML = `<span>${era.icon}</span> ${era.name}<span style="color:#0284c7">を学ぶ</span>`;
  document.getElementById('hub-sub').textContent = `${era.period} ／ ${era.sub}`;

  const eraRead = readMap[era.id] || [];
  const eraQuiz = quizMap[era.id] || {};
  const dots = document.getElementById('hub-dots');
  dots.innerHTML = era.episodes.map((ep, i) => {
    const read = eraRead.includes(i);
    const quiz = eraQuiz[i] !== undefined;
    const cls = quiz ? 'quiz-done' : read ? 'read' : '';
    return `<div class="hub-dot ${cls}" onclick="readEp(${i})" title="${ep.keyword}">${i+1}</div>`;
  }).join('');

  document.getElementById('hub-prog-label').textContent =
    `📖 ${eraRead.length}/${era.episodes.length}話読了`;
}

// ============================================================
// EPISODE LIST
// ============================================================
function showEpList() {
  const era = currentEra;
  const badge = document.getElementById('list-badge');
  badge.textContent = era.badge;
  badge.style.background = `var(--era-${era.id}-accent)`;
  badge.style.color = 'white';

  const eraRead = readMap[era.id] || [];
  const eraQuiz = quizMap[era.id] || {};
  const body = document.getElementById('ep-list-body');
  body.innerHTML = era.episodes.map((ep, i) => {
    const read = eraRead.includes(i);
    const score = eraQuiz[i];
    const badge = score !== undefined ? '✅' : read ? '📖' : '';
    return `<div class="ep-card ${read?'read':''}" onclick="readEp(${i})">
      <div class="ep-num">EP.${String(ep.id).padStart(2,'0')}</div>
      <div class="ep-info">
        <div class="ep-card-title">${ep.title}</div>
        <div class="ep-card-sub">${ep.subtitle}${score!==undefined?' ／ クイズ '+score+'/3点':''}</div>
      </div>
      <div class="ep-badge">${badge}</div>
    </div>`;
  }).join('');
  showScreen('list');
}

// ============================================================
// READER
// ============================================================
function readEp(idx) {
  currentEpIdx = idx;
  const ep = currentEra.episodes[idx];
  document.getElementById('reader-title').textContent = `${currentEra.icon} 第${ep.id}話 ${ep.keyword}`;
  document.getElementById('quiz-btn').style.display = '';
  document.getElementById('manga-content').innerHTML = buildMangaHtml(ep, currentEra);

  if (!readMap[currentEraId]) readMap[currentEraId] = [];
  if (!readMap[currentEraId].includes(idx)) {
    readMap[currentEraId].push(idx);
    localStorage.setItem('readMap2', JSON.stringify(readMap));
  }
  showScreen('reader');
  document.getElementById('screen-reader').scrollTop = 0;
}

      <div class="m-panel-inner">
        <div class="m-bubble-wrap">
          <div class="m-char-col"><div class="m-char-icon a">${getOwlAvatarHTML()}</div><div class="m-char-name">フクロウ先生</div></div>
          <div class="m-bubble">${c1line}</div>
        </div>

  <div class="m-page">

// ============================================================
// QUIZ
// ============================================================
function startQuizForCurrentEp() { startQuiz(currentEraId, currentEpIdx); }
function startRandomQuiz() { startQuiz(currentEraId, Math.floor(Math.random()*currentEra.episodes.length)); }

function startQuiz(eraId, epIdx) {
  lastQuizEraId = eraId;
  lastQuizEpIdx = epIdx;
  const era = ERAS.find(e=>e.id===eraId);
  const ep = era.episodes[epIdx];
  currentQuiz = [...ep.quiz];
  currentQuizIdx = 0;
  quizScore = 0;
  ['quiz-question','quiz-options','quiz-feedback','quiz-next-btn','quiz-prog-bar','quiz-ep-label']
    .forEach(id => { document.getElementById(id).style.display=''; });
  document.getElementById('quiz-result').className = 'quiz-result';
  document.getElementById('quiz-ep-label').textContent = `${era.icon} ${era.name}「${ep.keyword}」`;
  renderQuestion();
  showScreen('quiz');
}

function renderQuestion() {
  const q = currentQuiz[currentQuizIdx];
  document.getElementById('quiz-prog-bar').innerHTML =
    currentQuiz.map((_,i)=>`<div class="quiz-pd ${i<currentQuizIdx?'done':i===currentQuizIdx?'current':''}"></div>`).join('');
  document.getElementById('quiz-question').textContent = q.q;
  document.getElementById('quiz-options').innerHTML =
    q.opts.map((o,i)=>`<button class="quiz-option" onclick="answer(${i})">${o}</button>`).join('');
  document.getElementById('quiz-feedback').className = 'quiz-feedback';
  document.getElementById('quiz-next-btn').className = 'quiz-next-btn';
}

function answer(chosen) {
  const q = currentQuiz[currentQuizIdx];
  document.querySelectorAll('.quiz-option').forEach(o=>o.disabled=true);
  const fb = document.getElementById('quiz-feedback');
  if (chosen===q.ans) {
    document.querySelectorAll('.quiz-option')[chosen].classList.add('correct');
    fb.className='quiz-feedback correct-fb show';
    fb.innerHTML=`⭕ 正解！<br>${q.exp}`;
    quizScore++;
  } else {
    document.querySelectorAll('.quiz-option')[chosen].classList.add('wrong');
    document.querySelectorAll('.quiz-option')[q.ans].classList.add('correct');
    fb.className='quiz-feedback wrong-fb show';
    fb.innerHTML=`❌ 不正解。正解は「${q.opts[q.ans]}」<br>${q.exp}`;
  }
  document.getElementById('quiz-next-btn').className='quiz-next-btn show';
}

function nextQuestion() {
  currentQuizIdx++;
  if(currentQuizIdx>=currentQuiz.length) showResult();
  else renderQuestion();
}

function showResult() {
  ['quiz-question','quiz-options','quiz-feedback','quiz-next-btn','quiz-prog-bar','quiz-ep-label']
    .forEach(id=>{ document.getElementById(id).style.display='none'; });
  const era = ERAS.find(e=>e.id===lastQuizEraId);
  const ep = era.episodes[lastQuizEpIdx];
  if(!quizMap[lastQuizEraId]) quizMap[lastQuizEraId]={};
  quizMap[lastQuizEraId][lastQuizEpIdx]=quizScore;
  localStorage.setItem('quizMap2',JSON.stringify(quizMap));
  const stamps=['😢','😅','😊','🎉'];
  const labels=['もう一度読んでみよう！','もう少し！','よくできました！','満点！完璧！'];
  const si=quizScore===3?3:quizScore>=2?2:quizScore===1?1:0;
  document.getElementById('result-stamp').textContent=stamps[si];
  document.getElementById('result-score').textContent=`${quizScore}/3`;
  document.getElementById('result-label').textContent=labels[si];
  document.getElementById('result-sub').textContent=`${era.name}「${ep.keyword}」のクイズ結果`;
  document.getElementById('quiz-result').className='quiz-result show';
}

function retryQuiz() { startQuiz(lastQuizEraId,lastQuizEpIdx); }

// ============================================================
// SCREEN MANAGEMENT
// ============================================================
function showScreen(name) {
  initTrialSystem();
  if (!isContentAccessible() && name !== 'home') {
    showUnlockOverlay(PURCHASE_URL);
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='home') initEraGrid();
  if(name==='hub') renderHub();
  
}

// ============================================================
selectEra('edo');
initEraGrid();
